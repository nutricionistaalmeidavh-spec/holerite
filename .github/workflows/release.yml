name: Publish Holerites Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: holerites-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout completo para validar origem da tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar versão e criar tag apenas em merge de release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch origin main --tags
          if ($env:GITHUB_REF_TYPE -eq "branch") {
            if ($env:GITHUB_REF_NAME -ne "main") { throw "A publicação exige a branch main." }
            $subject = git log -1 --format=%s
            if (-not $subject.StartsWith("release: $tag")) {
              throw "O merge de publicação precisa ter o título: release: $tag"
            }
            $existingTag = @(git tag --list $tag)
            if ($existingTag.Count -gt 0) {
              $tagCommit = git rev-list -n 1 $tag
              if ($tagCommit -ne $env:GITHUB_SHA) {
                throw "A tag $tag já existe e aponta para outro commit."
              }
              Write-Host "A tag $tag já está neste commit; continuando a publicação."
            } else {
              git tag $tag $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a tag $tag." }
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar a tag $tag." }
            }
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "A tag deve corresponder à versão do package.json: $tag"
            }
          } else {
            throw "Publicação permitida apenas a partir da main ou de uma tag."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "A tag de release precisa apontar para um commit presente na main."
          }

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes automatizados
        run: npm test

      - name: Verificar tipos e build
        run: npm run build

      - name: Gerar NSIS e publicar release com latest.yml
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir metadados e instalador
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/latest.yml')) { throw 'latest.yml não foi gerado' }
          $setup = Get-ChildItem 'release/ArtiSys-Holerites-Setup-*.exe'
          if (-not $setup) { throw 'O instalador NSIS não foi gerado' }
